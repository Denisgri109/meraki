<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Merakí - Virtual Beauty Consultation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#ee2b3b",
            "background-light": "#f8f6f6",
            "background-dark": "#221012",
            "luxe-gold": "#D4AF37",
            "rose-gold": "#E0BFB8",
            "champagne": "#F7E7CE"
          },
          fontFamily: {
            "display": ["Manrope"]
          },
          borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
        },
      },
    }
  </script>
<style>
    .glass {
      background: rgba(34, 16, 18, 0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .gold-glow {
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark font-display text-white overflow-hidden antialiased">
<!-- Main Professional Video Feed -->
<div class="fixed inset-0 z-0">
<img alt="Professional beauty consultant Isabella looking into camera" class="w-full h-full object-cover" data-alt="Professional beauty consultant Isabella looking into camera" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAgt-W8yvyn4qnRja5UvSXLLNNSFpYeNOCDma747-iP78FCj8-T3PB2TqnwXrf6IZZ7I4GEP6GLORtoRXtx3maIpnfBFHzNy-7ZpNOQAAHoaptMVfEdwPpfsVxVYBVrfrBg-2VeNUB6fxzdpea4EQkNTmYGDESVd5-Rg-Ag-rqNlf2FN2IA3dEzJ4_HXYin5AY-LiaIkPRxZvPTbnkp2y99-cHt-xBNMGJsJ8Ji7zxvb05UD2iIh9OzRR0QHf-WzwFJbOKSAo_ev5aj"/>
<!-- Subtle gradient overlay for UI readability -->
<div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-black/40"></div>
</div>
<!-- iOS Safe Area Container -->
<div class="relative z-10 h-screen w-full flex flex-col justify-between p-4 pb-12 pt-14">
<!-- Top Header -->
<div class="flex items-center justify-between w-full glass rounded-xl px-4 py-3 border-white/5">
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
<div>
<h1 class="text-sm font-semibold text-champagne tracking-wide">Consultation with Isabella</h1>
<p class="text-[10px] text-white/60 uppercase tracking-widest font-medium">Master Esthetician</p>
</div>
</div>
<div class="flex items-center gap-4">
<div class="flex items-center gap-1.5 px-3 py-1 bg-white/10 rounded-full">
<span class="material-icons-outlined text-[14px] text-luxe-gold">timer</span>
<span class="text-sm font-medium tabular-nums text-champagne">12:45</span>
</div>
<div class="flex items-center gap-1">
<span class="material-icons-outlined text-[18px] text-green-400">signal_cellular_alt</span>
<span class="text-[10px] font-bold text-white/80">HD</span>
</div>
</div>
</div>
<!-- Floating Self-View (PiP) -->
<div class="absolute top-32 right-4 w-28 h-40 rounded-lg overflow-hidden border-2 border-rose-gold/40 shadow-2xl">
<img alt="User self-view camera feed" class="w-full h-full object-cover" data-alt="User self-view camera feed" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCiC3GXy2BVQXfIo2MKiTDqt57u4BPE68iZj12am6asgpscnSgL1KrP9LzKRwlltCIQBt3t2oijh2HuUOmkjCG0BhCeX8FTwGdKNDUsezmN2yKoltFFfcfDJnJyntIQAzpwFOA269rpZuzLquco7QSErZwDliGQWRiQqs5xQaApynmaEoGNRldmkMP3GNLd9RWjjBVi5jW_f1sWc3if_FTUMxhuSlD2Wz9j0C6jL7pS963-hKsSHw-HDsBieR8hi1fVYiBpT3vLsyNA"/>
<div class="absolute bottom-1 right-1">
<span class="material-icons-outlined text-[12px] text-white/70">videocam</span>
</div>
</div>
<!-- Right Side Action Icons -->
<div class="absolute right-4 top-1/2 -translate-y-1/2 flex flex-col gap-4">
<button class="w-12 h-12 glass rounded-full flex items-center justify-center text-champagne hover:bg-white/20 transition-all border-white/10">
<span class="material-icons-outlined">chat_bubble_outline</span>
</button>
<button class="w-12 h-12 glass rounded-full flex items-center justify-center text-champagne hover:bg-white/20 transition-all border-white/10">
<span class="material-icons-outlined">add_a_photo</span>
</button>
<button class="w-12 h-12 glass rounded-full flex items-center justify-center text-champagne hover:bg-white/20 transition-all border-white/10">
<span class="material-icons-outlined">event_note</span>
</button>
<button class="w-12 h-12 glass rounded-full flex items-center justify-center text-champagne hover:bg-white/20 transition-all border-white/10">
<span class="material-icons-outlined">more_horiz</span>
</button>
</div>
<!-- Bottom Controls Bar -->
<div class="flex flex-col items-center gap-6">
<!-- Call Actions -->
<div class="glass px-8 py-4 rounded-full flex items-center gap-8 border-white/10 shadow-2xl">
<button class="flex flex-col items-center gap-1">
<div class="w-12 h-12 rounded-full flex items-center justify-center bg-white/10 text-white hover:bg-white/20 transition-all">
<span class="material-icons-outlined">mic_none</span>
</div>
<span class="text-[10px] text-white/60 font-medium">Mute</span>
</button>
<button class="flex flex-col items-center gap-1">
<div class="w-12 h-12 rounded-full flex items-center justify-center bg-white/10 text-white hover:bg-white/20 transition-all">
<span class="material-icons-outlined">videocam</span>
</div>
<span class="text-[10px] text-white/60 font-medium">Camera</span>
</button>
<button class="flex flex-col items-center gap-1">
<div class="w-14 h-14 rounded-full flex items-center justify-center bg-primary text-white shadow-lg hover:brightness-110 transition-all gold-glow">
<span class="material-icons-outlined text-[28px]">call_end</span>
</div>
<span class="text-[10px] text-primary font-bold uppercase tracking-wider">End</span>
</button>
<button class="flex flex-col items-center gap-1">
<div class="w-12 h-12 rounded-full flex items-center justify-center bg-white/10 text-white hover:bg-white/20 transition-all">
<span class="material-icons-outlined">flip_camera_ios</span>
</div>
<span class="text-[10px] text-white/60 font-medium">Flip</span>
</button>
<button class="flex flex-col items-center gap-1">
<div class="w-12 h-12 rounded-full flex items-center justify-center bg-white/10 text-white hover:bg-white/20 transition-all">
<span class="material-icons-outlined">volume_up</span>
</div>
<span class="text-[10px] text-white/60 font-medium">Speaker</span>
</button>
</div>
<!-- iOS Home Indicator Spacing -->
<div class="w-32 h-1 bg-white/20 rounded-full mx-auto mt-2"></div>
</div>
</div>
<!-- Decorative Luxe Elements -->
<div class="fixed top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-luxe-gold/30 to-transparent"></div>
<div class="fixed bottom-0 left-0 w-full h-32 bg-gradient-to-t from-background-dark/80 to-transparent pointer-events-none"></div>
</body></html>
