<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Merakí Shopping Cart</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ecb613",
                        "background-light": "#f8f8f6",
                        "background-dark": "#0F0F13", // Updated to match context
                        "rose-luxe": "#D4A373",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(236, 182, 19, 0.1);
        }
        .ios-safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .checkout-gradient {
            background: linear-gradient(135deg, #D4A373 0%, #ecb613 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<!-- Header -->
<header class="sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-primary/10">
<div class="max-w-md mx-auto px-6 py-4 flex items-center justify-between">
<button class="w-10 h-10 flex items-center justify-start text-primary">
<span class="material-icons">arrow_back_ios</span>
</button>
<div class="text-center">
<h1 class="text-lg font-bold tracking-tight uppercase">Your Cart</h1>
<p class="text-[10px] text-primary/70 tracking-widest uppercase">3 Items Selected</p>
</div>
<button class="w-10 h-10 flex items-center justify-end">
<span class="material-icons text-primary/40">more_vert</span>
</button>
</div>
</header>
<main class="max-w-md mx-auto px-6 pb-48">
<!-- Free Shipping Banner -->
<div class="mt-6 mb-8 p-4 rounded-lg glass border-primary/20 flex flex-col gap-2">
<div class="flex justify-between items-center text-xs mb-1">
<span class="text-primary font-medium">Free shipping on orders over €50!</span>
<span class="text-primary/60">€12.00 left</span>
</div>
<div class="w-full bg-white/5 h-1.5 rounded-full overflow-hidden">
<div class="bg-primary h-full rounded-full" style="width: 76%"></div>
</div>
</div>
<!-- Cart Items List -->
<div class="space-y-4">
<!-- Item 1 -->
<div class="glass p-4 rounded-xl flex gap-4 items-center">
<div class="w-20 h-20 bg-white/5 rounded-lg overflow-hidden flex-shrink-0">
<img class="w-full h-full object-cover" data-alt="Luxury face serum bottle in dark lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBi0hiMIvtK2X8PHWFj5nlUIYzmha3Yzx_EOyhwbGEM4ZXO15kWoAH9NGKqkwdoWygIwun0SN59xFQoihu5VrO5jHrl8aWwcrZAQZgGVqPvEhMB4gaLwg9LC-Y5BT5hNO8Hw7ZOIeZ_58i6rzqst-HKAF7yl2sWV4KDDo8scAcBpOhR1ql4PVuqqRXTUsDNbv0Rp58RS456Xdk9Xx2juGdXmayIjI1HdLjQASvtBYRewRjVs0Wr8ZkVfrNfTLJUU_fb69sUcXkKI3_6"/>
</div>
<div class="flex-grow flex flex-col gap-1">
<div class="flex justify-between items-start">
<h3 class="text-sm font-semibold">Silk Radiance Serum</h3>
<button class="text-white/30 hover:text-red-400 transition-colors">
<span class="material-icons text-sm">delete_outline</span>
</button>
</div>
<p class="text-[11px] text-white/50 uppercase tracking-wider">30ml / Anti-Aging</p>
<div class="mt-2 flex justify-between items-center">
<span class="text-primary font-bold">€38.00</span>
<div class="flex items-center gap-3 bg-white/5 rounded-full px-2 py-1 border border-white/10">
<button class="w-6 h-6 flex items-center justify-center text-primary/60 hover:text-primary">
<span class="material-icons text-sm">remove</span>
</button>
<span class="text-xs font-medium w-4 text-center">1</span>
<button class="w-6 h-6 flex items-center justify-center text-primary/60 hover:text-primary">
<span class="material-icons text-sm">add</span>
</button>
</div>
</div>
</div>
</div>
<!-- Item 2 -->
<div class="glass p-4 rounded-xl flex gap-4 items-center">
<div class="w-20 h-20 bg-white/5 rounded-lg overflow-hidden flex-shrink-0">
<img class="w-full h-full object-cover" data-alt="Premium gold leaf face mask packaging" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBgEpJNZF5XreHNfh7QkDpn41Bf6-u2nfc2zMOTUfZDh7EvYjR-vj4uP3JEJiDURi3wbmQEOsI0DvY3kAv3hzCa7GaTG5yqqc2vtRW8xR7BDqV5m_J_EHX6XsxVrZDqcNKzLm09tO9VnwbSW__ULZdYVcLKFBqnDnQtuH2CdH426-uW_euuxFAClrKd6SLrCCuwQ9EA1UU1wL2dFnwoDu14gapxouQbmEl8HBi3DiF-UyZ8ytu2hteLRFVxDjjIqa12zyw9e8EznSqS"/>
</div>
<div class="flex-grow flex flex-col gap-1">
<div class="flex justify-between items-start">
<h3 class="text-sm font-semibold">Gold Leaf Face Mask</h3>
<button class="text-white/30 hover:text-red-400 transition-colors">
<span class="material-icons text-sm">delete_outline</span>
</button>
</div>
<p class="text-[11px] text-white/50 uppercase tracking-wider">Set of 5 / Rejuvenating</p>
<div class="mt-2 flex justify-between items-center">
<span class="text-primary font-bold">€24.00</span>
<div class="flex items-center gap-3 bg-white/5 rounded-full px-2 py-1 border border-white/10">
<button class="w-6 h-6 flex items-center justify-center text-primary/60 hover:text-primary">
<span class="material-icons text-sm">remove</span>
</button>
<span class="text-xs font-medium w-4 text-center">1</span>
<button class="w-6 h-6 flex items-center justify-center text-primary/60 hover:text-primary">
<span class="material-icons text-sm">add</span>
</button>
</div>
</div>
</div>
</div>
</div>
<!-- Promo Code -->
<div class="mt-10">
<label class="text-[10px] text-primary uppercase tracking-[0.2em] mb-3 block px-1">Promo Code</label>
<div class="flex gap-2">
<input class="bg-white/5 border border-white/10 text-white rounded-lg px-4 py-3 flex-grow focus:ring-1 focus:ring-primary focus:border-primary outline-none text-sm placeholder:text-white/20" placeholder="Enter code" type="text"/>
<button class="bg-primary/20 text-primary border border-primary/30 px-6 py-3 rounded-lg text-sm font-semibold hover:bg-primary/30 transition-all uppercase tracking-wider">Apply</button>
</div>
</div>
<!-- Order Summary -->
<div class="mt-12 space-y-4 border-t border-white/5 pt-8">
<div class="flex justify-between items-center text-sm">
<span class="text-white/50">Subtotal</span>
<span class="font-medium">€62.00</span>
</div>
<div class="flex justify-between items-center text-sm">
<span class="text-white/50">Shipping</span>
<span class="font-medium text-emerald-500 uppercase text-[10px] tracking-widest">Free</span>
</div>
<div class="flex justify-between items-center text-sm">
<span class="text-white/50">Taxes</span>
<span class="font-medium">€5.20</span>
</div>
<div class="flex justify-between items-center pt-4 mt-4 border-t border-white/10">
<span class="text-base font-bold uppercase tracking-widest">Total</span>
<span class="text-2xl font-bold text-primary">€67.20</span>
</div>
</div>
</main>
<!-- Sticky Footer -->
<div class="fixed bottom-0 left-0 right-0 bg-background-dark/95 backdrop-blur-xl border-t border-white/5">
<div class="max-w-md mx-auto px-6 pt-6 pb-8 ios-safe-bottom flex flex-col gap-4">
<button class="checkout-gradient w-full py-4 rounded-xl text-background-dark font-bold uppercase tracking-[0.15em] shadow-[0_10px_30px_-10px_rgba(236,182,19,0.4)] active:scale-[0.98] transition-all">
                Proceed to Checkout
            </button>
<a class="text-center text-white/40 text-[11px] uppercase tracking-widest hover:text-primary transition-colors" href="#">
                Continue Shopping
            </a>
</div>
</div>
<!-- Bottom Navigation Bar (iOS Style) -->
<nav class="fixed bottom-0 left-0 right-0 z-50 pointer-events-none">
<div class="max-w-md mx-auto px-6 pb-2">
<div class="pointer-events-auto flex justify-around items-center h-16 bg-white/5 backdrop-blur-2xl rounded-full mb-2 border border-white/10 px-4">
<button class="text-white/40 hover:text-primary transition-colors">
<span class="material-icons">home</span>
</button>
<button class="text-white/40 hover:text-primary transition-colors">
<span class="material-icons">search</span>
</button>
<button class="text-primary">
<span class="material-icons">shopping_bag</span>
</button>
<button class="text-white/40 hover:text-primary transition-colors">
<span class="material-icons">favorite_border</span>
</button>
<button class="text-white/40 hover:text-primary transition-colors">
<span class="material-icons">person_outline</span>
</button>
</div>
</div>
</nav>
</body></html>
