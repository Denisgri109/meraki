<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Merakí Inventory Manager</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ee2b4b",
                        "background-light": "#f8f6f6",
                        "background-dark": "#0a0506", // Deep warm black for luxury feel
                        "champagne-gold": "#d4af37",
                        "rose-gold": "#b76e79",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .rose-gold-gradient {
            background: linear-gradient(135deg, #e5b2ca 0%, #b76e79 100%);
        }
        .pulse-red {
            box-shadow: 0 0 0 0 rgba(238, 43, 75, 0.7);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(238, 43, 75, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(238, 43, 75, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(238, 43, 75, 0); }
        }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<!-- Header Section -->
<header class="sticky top-0 z-50 px-6 pt-12 pb-6 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
<div class="flex items-center justify-between mb-6">
<h1 class="text-3xl font-extrabold tracking-tight">Inventory</h1>
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full glass">
<span class="material-icons-round text-xl">search</span>
</button>
</div>
</div>
<button class="rose-gold-gradient w-full py-4 rounded-xl flex items-center justify-center gap-2 text-white font-bold shadow-lg shadow-rose-gold/20">
<span class="material-icons-round">add</span>
<span>Add Product</span>
</button>
</header>
<main class="px-6 pb-32 space-y-8">
<!-- Stats Row -->
<div class="grid grid-cols-2 gap-4">
<div class="glass p-5 rounded-2xl flex flex-col gap-1">
<span class="text-xs font-semibold uppercase tracking-wider opacity-60">Total Products</span>
<span class="text-3xl font-bold">156</span>
</div>
<div class="glass p-5 rounded-2xl flex flex-col gap-1 relative overflow-hidden">
<div class="flex items-center gap-2">
<span class="text-xs font-semibold uppercase tracking-wider opacity-60">Low Stock</span>
<div class="w-2 h-2 rounded-full bg-primary pulse-red"></div>
</div>
<span class="text-3xl font-bold text-primary">8</span>
</div>
</div>
<!-- Category Filters -->
<div class="flex gap-3 overflow-x-auto no-scrollbar -mx-6 px-6">
<button class="px-6 py-2 rounded-full bg-primary text-white font-semibold whitespace-nowrap">All</button>
<button class="px-6 py-2 rounded-full glass font-medium whitespace-nowrap opacity-80">Lash Care</button>
<button class="px-6 py-2 rounded-full glass font-medium whitespace-nowrap opacity-80">Nail Care</button>
<button class="px-6 py-2 rounded-full glass font-medium whitespace-nowrap opacity-80">Skin Rituals</button>
<button class="px-6 py-2 rounded-full glass font-medium whitespace-nowrap opacity-80">Hair</button>
</div>
<!-- Product List -->
<div class="space-y-4">
<!-- Card 1: Critical Stock -->
<div class="glass p-4 rounded-2xl flex gap-4 items-center relative group">
<button class="absolute top-4 right-4 text-slate-400 group-hover:text-primary transition-colors">
<span class="material-icons-round text-xl">edit</span>
</button>

</div>
<div class="flex-1 min-w-0">
<h3 class="font-bold text-lg truncate">Lash Growth Serum X</h3>
<p class="text-xs font-medium opacity-50 mb-3 uppercase tracking-tighter">SKU: MK-7821</p>
<div class="flex items-center justify-between mb-1.5">
<span class="text-xs font-bold text-primary">2 units left</span>
<span class="text-xs font-bold text-champagne-gold">$45.00</span>
</div>
<div class="w-full bg-white/10 h-1.5 rounded-full overflow-hidden">
<div class="bg-primary h-full rounded-full" style="width: 15%"></div>
</div>
</div>
</div>
<!-- Card 2: Warning Stock -->
<div class="glass p-4 rounded-2xl flex gap-4 items-center relative group">
<button class="absolute top-4 right-4 text-slate-400 group-hover:text-primary transition-colors">
<span class="material-icons-round text-xl">edit</span>
</button>
<div class="w-20 h-20 rounded-xl overflow-hidden flex-shrink-0">
<img alt="Nail Oil" class="w-full h-full object-cover" data-alt="Rose petal infused nail oil bottle" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBMuy1c51YQBkOFQN_aLAO8oiRmXKkhTfPJqxDJAUeMSkgk6AthFbTh4bc9AXKXIWRsnVt7bM422rFXX6YaEP56bYf0qrnhlzJ_re2lyCU4ns1FgK5C_BClm7Rj-bPameCAJKtfN-h5Qyqxoz4oAx4ogbS2HdOmFjQk582VLb1YC0ZYw2MK6-Q2CWD4NYv46QnHziQrBGyeg61tG5atZh3wEf6riJxIeyNRa2ZKVCv5BHPKb5psS_7tGVH8ANbplwzUnYZxuSvkkYYD"/>
</div>
<div class="flex-1 min-w-0">
<h3 class="font-bold text-lg truncate">Rose Botanical Nail Oil</h3>
<p class="text-xs font-medium opacity-50 mb-3 uppercase tracking-tighter">SKU: MK-2290</p>
<div class="flex items-center justify-between mb-1.5">
<span class="text-xs font-bold text-amber-500">8 units left</span>
<span class="text-xs font-bold text-champagne-gold">$32.00</span>
</div>
<div class="w-full bg-white/10 h-1.5 rounded-full overflow-hidden">
<div class="bg-amber-500 h-full rounded-full" style="width: 45%"></div>
</div>
</div>
</div>
<!-- Card 3: Good Stock -->
<div class="glass p-4 rounded-2xl flex gap-4 items-center relative group">
<button class="absolute top-4 right-4 text-slate-400 group-hover:text-primary transition-colors">
<span class="material-icons-round text-xl">edit</span>
</button>
<div class="w-20 h-20 rounded-xl overflow-hidden flex-shrink-0">
<img alt="Facial Mist" class="w-full h-full object-cover" data-alt="Premium glass bottle of facial mist" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDJ28E4Bt2V4TmXtF2aTw42u-XtsOdnOtnoi-gog5_aQ30tDuEeJJUUYbCwtN0ealKE4SU5AYOmh4kpPqpkC_coprcMIgE2Jgo3JiV5j1fI6oJlw2FrncPNy93kFMSBldDjROjUc1SwMbWwV57aYc0MGkEwnHyT0VaJ2F92BCVRDLJuF5ZFaKRVrV3MNYGj2jNqxg_CoAjngSM1HhPPUyUukLeWP_m0dhfbGnvxRbbOqSrzx6W0mGi8YbbhYSe9aA2TztglIRNUj0BW"/>
</div>
<div class="flex-1 min-w-0">
<h3 class="font-bold text-lg truncate">Aura Hydrating Mist</h3>
<p class="text-xs font-medium opacity-50 mb-3 uppercase tracking-tighter">SKU: MK-4412</p>
<div class="flex items-center justify-between mb-1.5">
<span class="text-xs font-bold text-emerald-500">42 units left</span>
<span class="text-xs font-bold text-champagne-gold">$68.00</span>
</div>
<div class="w-full bg-white/10 h-1.5 rounded-full overflow-hidden">
<div class="bg-emerald-500 h-full rounded-full" style="width: 85%"></div>
</div>
</div>
</div>
<!-- Card 4: Good Stock -->
<div class="glass p-4 rounded-2xl flex gap-4 items-center relative group">
<button class="absolute top-4 right-4 text-slate-400 group-hover:text-primary transition-colors">
<span class="material-icons-round text-xl">edit</span>
</button>
<div class="w-20 h-20 rounded-xl overflow-hidden flex-shrink-0">
<img alt="Exfoliant" class="w-full h-full object-cover" data-alt="Minimalist skincare tube on marble surface" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAXOLV7inl_V3MhLWGfhCZ0mnW3WOcUhcyJqOgXk1qQppRHHZKpsxY0uta_9NcLPcBMHVBrsh2w5MlgnlysDjHWrXvxaAb-cXxjDtuzOpF5JtmUW3ZVetySs27ApuGsfb--QGT4DSM1DLFIddWvEX29a5Ev-U2kldI_XA5cND31O_c47nhkmfZYWil2sOcfggYyjkb1RB42ofIh8F1xU563Q3fSYursug53m9OzrdBfAHKUvRay_G6JlnCUgqWkkymGhTNYfy2DhAWu"/>
</div>
<div class="flex-1 min-w-0">
<h3 class="font-bold text-lg truncate">Velvet Peptide Peel</h3>
<p class="text-xs font-medium opacity-50 mb-3 uppercase tracking-tighter">SKU: MK-0912</p>
<div class="flex items-center justify-between mb-1.5">
<span class="text-xs font-bold text-emerald-500">28 units left</span>
<span class="text-xs font-bold text-champagne-gold">$110.00</span>
</div>
<div class="w-full bg-white/10 h-1.5 rounded-full overflow-hidden">
<div class="bg-emerald-500 h-full rounded-full" style="width: 60%"></div>
</div>
</div>
</div>
</div>
</main>
<!-- Admin Bottom Navigation -->
<nav class="fixed bottom-0 left-0 right-0 glass border-t border-white/5 pb-8 pt-4 px-8 flex justify-between items-center z-50">
<button class="flex flex-col items-center gap-1 opacity-40">
<span class="material-icons-round">dashboard</span>
<span class="text-[10px] font-bold uppercase tracking-widest">Board</span>
</button>
<button class="flex flex-col items-center gap-1 opacity-40">
<span class="material-icons-round">calendar_today</span>
<span class="text-[10px] font-bold uppercase tracking-widest">Bookings</span>
</button>
<button class="flex flex-col items-center gap-1 text-primary">
<span class="material-icons-round">inventory_2</span>
<span class="text-[10px] font-bold uppercase tracking-widest">Stock</span>
</button>
<button class="flex flex-col items-center gap-1 opacity-40">
<span class="material-icons-round">analytics</span>
<span class="text-[10px] font-bold uppercase tracking-widest">Sales</span>
</button>
<button class="flex flex-col items-center gap-1 opacity-40">
<span class="material-icons-round">settings</span>
<span class="text-[10px] font-bold uppercase tracking-widest">Setup</span>
</button>
</nav>
</body></html>
