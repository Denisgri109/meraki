<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Merakí - User Profile &amp; Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e6194c",
                        "background-light": "#f8f6f6",
                        "background-dark": "#0F0F13",
                        "glass-white": "rgba(255, 255, 255, 0.05)",
                        "glass-border": "rgba(255, 255, 255, 0.1)",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .icon-gradient {
            background: linear-gradient(135deg, #e6194c 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-white min-h-screen pb-24">

<div class="h-12 flex justify-between items-center px-8 w-full sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
<span class="text-sm font-semibold">9:41</span>
<div class="flex gap-2 items-center">
<span class="material-icons-round text-lg">signal_cellular_alt</span>
<span class="material-icons-round text-lg">wifi</span>
<span class="material-icons-round text-lg">battery_full</span>
</div>
</div>

<main class="px-6 space-y-8 max-w-md mx-auto">

<header class="flex flex-col items-center mt-6 space-y-4">
<div class="relative">
<div class="w-28 h-28 rounded-full p-1 bg-gradient-to-tr from-primary to-rose-300">

<span class="material-icons-round text-white text-sm">camera_alt</span>
</div>
</div>
<div class="text-center">
<h1 class="text-2xl font-bold tracking-tight">Sofia Anderson</h1>
<p class="text-gray-500 dark:text-gray-400 text-sm">sofia.a@lux.com</p>
</div>
<button class="bg-primary/10 text-primary px-6 py-2 rounded-full text-sm font-semibold border border-primary/20">

            </button>
</header>

<section class="glass-card rounded-lg p-6 relative overflow-hidden">
<div class="absolute -right-8 -top-8 w-32 h-32 bg-primary/10 rounded-full blur-3xl"></div>
<div class="relative flex justify-between items-center">

<p class="text-xs uppercase tracking-widest text-primary font-bold">Merakí Elite</p>
<h2 class="text-3xl font-bold">2,450 <span class="text-lg font-medium text-gray-400">pts</span></h2>

</div>
</div>

</div>

<button class="w-full flex items-center justify-between p-4 hover:bg-white/5 transition-colors border-b border-glass-border">

</div>
<span class="material-icons-round text-gray-500 text-xl">chevron_right</span>

<button class="w-full flex items-center justify-between p-4 hover:bg-white/5 transition-colors">

</div>
<span class="material-icons-round text-gray-500 text-xl">chevron_right</span>
</button>
</div>
</div>

<div class="glass-card rounded-lg overflow-hidden">
<button class="w-full flex items-center justify-between p-4 hover:bg-white/5 transition-colors border-b border-glass-border">
<div class="flex items-center gap-4">
<span class="material-icons-round icon-gradient">stars</span>
<span class="font-medium">My Points</span>
</div>
<span class="material-icons-round text-gray-500 text-xl">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-4 hover:bg-white/5 transition-colors">
<div class="flex items-center gap-4">
<span class="material-icons-round icon-gradient">qr_code_2</span>
<span class="font-medium">Digital Stamp Cards</span>
</div>
<span class="material-icons-round text-gray-500 text-xl">chevron_right</span>
</button>
</div>
</div>

<h3 class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest ml-2">Support</h3>
<div class="glass-card rounded-lg overflow-hidden">
<button class="w-full flex items-center justify-between p-4 hover:bg-white/5 transition-colors border-b border-glass-border">
<div class="flex items-center gap-4">
<span class="material-icons-round icon-gradient">help_outline</span>
<span class="font-medium">Help Center</span>
</div>
<span class="material-icons-round text-gray-500 text-xl">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-4 hover:bg-white/5 transition-colors">
<div class="flex items-center gap-4">
<span class="material-icons-round icon-gradient">support_agent</span>

</div>
<span class="material-icons-round text-gray-500 text-xl">chevron_right</span>
</button>
</div>
</div>

<nav class="fixed bottom-0 left-0 right-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-xl border-t border-glass-border">

<button class="flex flex-col items-center gap-1 text-gray-500">
<span class="material-icons-round text-2xl">home</span>
<span class="text-[10px] font-semibold uppercase tracking-wider">Discover</span>
</button>
<button class="flex flex-col items-center gap-1 text-gray-500">
<span class="material-icons-round text-2xl">search</span>
<span class="text-[10px] font-semibold uppercase tracking-wider">Book</span>
</button>
<button class="flex flex-col items-center gap-1 text-gray-500">
<span class="material-icons-round text-2xl">favorite_border</span>
<span class="text-[10px] font-semibold uppercase tracking-wider">Saved</span>
</button>
<button class="flex flex-col items-center gap-1 text-primary">
<span class="material-icons-round text-2xl">person</span>
<span class="text-[10px] font-semibold uppercase tracking-wider">Profile</span>
</button>
</div>
<!-- iOS Home Indicator -->
<div class="w-32 h-1 bg-gray-500/30 rounded-full mx-auto mb-2"></div>
