<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit User Profile - Merakí Luxe</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ef3966",
                        "champagne": "#E2C799",
                        "background-light": "#f8f6f6",
                        "background-dark": "#0F0F13",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .gradient-btn {
            background: linear-gradient(135deg, #ef3966 0%, #E2C799 100%);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .ios-shadow {
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex justify-center">
<!-- Mobile Container (iPhone Form Factor) -->
<div class="relative w-full max-w-[430px] h-[932px] bg-background-light dark:bg-background-dark overflow-hidden flex flex-col ios-shadow">
<!-- Header -->
<header class="px-6 pt-14 pb-4 flex items-center justify-between sticky top-0 z-20 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
<button class="w-10 h-10 flex items-center justify-start text-slate-800 dark:text-white">
<span class="material-icons-outlined">arrow_back_ios</span>
</button>
<h1 class="text-lg font-semibold tracking-tight">Edit Profile</h1>
<button class="text-champagne font-medium hover:opacity-80 transition-opacity">Save</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto hide-scrollbar px-6 pb-24">
<!-- Profile Photo Section -->
<div class="flex flex-col items-center mt-6 mb-10">
<div class="relative group">
<div class="w-32 h-32 rounded-full p-1 border-2 border-primary">
<img alt="Profile Picture" class="w-full h-full rounded-full object-cover" data-alt="Beautiful woman with professional wellness photography" src="https://lh3.googleusercontent.com/aida-public/AB6AXuALMdy0zC-rD4ehAaSonMILXPKiBb7rveffSrfCu_NErBY-JONPA3cycF2Wo_TDOkvm-LkoieLX9YbT-suh17U7nG-Ctj19K5w6jX19zgfmTnrg2Xz83tVWxXc0fEip8Ks-rirEqihxJOvrYMIHZnltUzBe3GKJTXT46oiOBao_rMH2oSw97vwes-ewt7RUflFyyUeXKpAtUclQFDJkSnTPyc_W2gc283YmmqWwdRK7GzDpcUR5mX-clQR46EyeFZmfgKZzyDvQByOE"/>
</div>
<button class="absolute bottom-1 right-1 bg-primary text-white w-9 h-9 rounded-full flex items-center justify-center border-4 border-background-dark">
<span class="material-icons-outlined text-sm">photo_camera</span>
</button>
</div>
<p class="mt-4 text-xs font-semibold uppercase tracking-widest text-primary/80">Change Photo</p>
</div>
<!-- Personal Details -->
<section class="space-y-6">
<h2 class="text-[11px] font-bold uppercase tracking-[0.2em] text-slate-500 dark:text-slate-400 pl-1">Personal Details</h2>
<div class="space-y-4">
<!-- Full Name -->
<div class="glass-card rounded-[20px] p-4 group focus-within:border-primary/50 transition-all">
<label class="block text-[10px] font-medium text-slate-500 uppercase tracking-wider mb-1">Full Name</label>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-sm font-medium dark:text-white" placeholder="Enter your name" type="text" value="Sophia Merakí-Luxe"/>
</div>
<!-- Username -->
<div class="glass-card rounded-[20px] p-4 group focus-within:border-primary/50 transition-all">
<label class="block text-[10px] font-medium text-slate-500 uppercase tracking-wider mb-1">Username</label>
<div class="flex items-center">
<span class="text-primary mr-1 text-sm">@</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-sm font-medium dark:text-white" placeholder="username" type="text" value="sophialuxe"/>
</div>
</div>
<!-- Bio -->
<div class="glass-card rounded-[20px] p-4 group focus-within:border-primary/50 transition-all">
<label class="block text-[10px] font-medium text-slate-500 uppercase tracking-wider mb-1">Bio / About Me</label>
<textarea class="w-full bg-transparent border-none p-0 focus:ring-0 text-sm font-medium dark:text-white resize-none" placeholder="Tell us about yourself..." rows="3">Wellness enthusiast and luxury spa connoisseur. Living for moments of pure serenity.</textarea>
</div>
<!-- Phone -->
<div class="glass-card rounded-[20px] p-4 group focus-within:border-primary/50 transition-all">
<label class="block text-[10px] font-medium text-slate-500 uppercase tracking-wider mb-1">Phone Number</label>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-sm font-medium dark:text-white" placeholder="+1 (000) 000-0000" type="tel" value="+1 (555) 012-3456"/>
</div>
<!-- Email -->
<div class="glass-card rounded-[20px] p-4 group focus-within:border-primary/50 transition-all">
<label class="block text-[10px] font-medium text-slate-500 uppercase tracking-wider mb-1">Email Address</label>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-sm font-medium dark:text-white" placeholder="email@example.com" type="email" value="sophia.luxe@meraki.com"/>
</div>
</div>
</section>
<!-- Preferences -->
<section class="mt-10 space-y-6">
<h2 class="text-[11px] font-bold uppercase tracking-[0.2em] text-slate-500 dark:text-slate-400 pl-1">Preferences</h2>
<div class="space-y-3">
<!-- Notification Settings -->
<div class="glass-card rounded-[20px] px-5 py-4 flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-icons-outlined text-primary text-xl">notifications</span>
<span class="text-sm font-medium">Notification Settings</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<!-- Location Services -->
<div class="glass-card rounded-[20px] px-5 py-4 flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-icons-outlined text-primary text-xl">near_me</span>
<span class="text-sm font-medium">Location Services</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</div>
</section>
<!-- Security & Account Actions -->
<section class="mt-10 mb-12 space-y-4 px-1">
<button class="flex items-center w-full text-sm font-medium text-slate-400 hover:text-white transition-colors">
<span class="material-icons-outlined mr-3 text-lg opacity-60">lock</span>
                    Change Password
                </button>
<button class="flex items-center w-full text-sm font-medium text-red-400/80 hover:text-red-400 transition-colors mt-6">
<span class="material-icons-outlined mr-3 text-lg opacity-60">delete_outline</span>
                    Delete Account
                </button>
</section>
</main>
<!-- Fixed Footer CTA -->
<div class="absolute bottom-0 left-0 right-0 p-6 pt-4 bg-gradient-to-t from-background-dark via-background-dark/95 to-transparent">
<button class="w-full py-4 rounded-full gradient-btn text-white font-bold text-sm tracking-wide shadow-xl shadow-primary/20 active:scale-[0.98] transition-transform">
                SAVE CHANGES
            </button>
<div class="mt-4 flex justify-center">
<div class="w-32 h-1 bg-white/20 rounded-full"></div>
</div>
</div>
</div>
</body></html>
