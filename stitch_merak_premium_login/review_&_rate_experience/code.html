<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ef3966",
                        "champagne": "#F7E7CE",
                        "gold-start": "#D4AF37",
                        "gold-end": "#F7E7CE",
                        "background-light": "#f8f6f6",
                        "background-dark": "#0F0F13",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-submit {
            background: linear-gradient(135deg, #ef3966 0%, #D4AF37 100%);
        }
        .star-gradient {
            background: linear-gradient(135deg, #D4AF37 0%, #F7E7CE 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar {
            display: none;
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-gray-100 antialiased">
<!-- iOS Status Bar Placeholder -->
<div class="h-12 w-full"></div>
<main class="max-w-md mx-auto px-6 pb-10 min-h-screen flex flex-col">
<!-- Header -->
<header class="flex items-center justify-between py-4 mb-6">
<div class="w-10"></div> <!-- Spacer for centering -->
<h1 class="text-lg font-bold tracking-tight">Write a Review</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full glass-card">
<span class="material-icons-outlined text-xl">close</span>
</button>
</header>
<!-- Service & Professional Card -->
<section class="glass-card rounded-xl p-4 flex items-center space-x-4 mb-8">
<div class="relative">
<img class="w-16 h-16 rounded-full object-cover border-2 border-primary/30" data-alt="Professional stylist headshot" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAeylToTzb0k6kWFlkUIYRZ0B53AcUDeeneHUuGxCEAELVbvv3Jq-_OSWaUBOVtL60O6nezW-u1-S7scJIuBSuUXcoJuG6bmXNQTYqFphKW_Gz9WNx7DiqigSKS9DhPe3ASFd6QQwBLx9NP6kVWMxG4yb-DflXn-TpLdLvASVjCpM-9InozK9GBP2rQbiF2uMYF2jUJcbVU8i07ps4X9VVVa00J_FKdbYONl_R9tg_JdN7WAZd-lH8EaseGSVUQOdQY9XU0iglzv4bL"/>
<div class="absolute -bottom-1 -right-1 bg-primary w-5 h-5 rounded-full flex items-center justify-center border-2 border-[#0F0F13]">
<span class="material-icons-outlined text-[10px] text-white">verified</span>
</div>
</div>
<div>
<h2 class="text-base font-bold">Sarah Jenkins</h2>
<p class="text-sm text-gray-400">Volume Lashes • Feb 14, 2:30 PM</p>
</div>
</section>
<!-- Rating Section -->
<section class="text-center mb-8">
<h3 class="text-xl font-semibold mb-4">How was your experience?</h3>
<div class="flex justify-center space-x-2">
<span class="material-icons-outlined text-4xl star-gradient">star</span>
<span class="material-icons-outlined text-4xl star-gradient">star</span>
<span class="material-icons-outlined text-4xl star-gradient">star</span>
<span class="material-icons-outlined text-4xl star-gradient">star</span>
<span class="material-icons-outlined text-4xl text-gray-700">star_outline</span>
</div>
</section>
<!-- Feedback Input -->
<section class="mb-6">
<textarea class="w-full h-40 glass-card rounded-xl p-5 text-sm focus:ring-1 focus:ring-primary/50 border-none outline-none resize-none placeholder-gray-500" placeholder="Tell us what you loved about your experience with Sarah..."></textarea>
</section>
<!-- Photo Upload -->
<section class="mb-8">
<button class="w-full glass-card rounded-xl py-8 border-dashed border-2 border-gray-700 flex flex-col items-center justify-center space-y-2 group active:scale-[0.98] transition-transform">
<div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary">
<span class="material-icons-outlined">photo_camera</span>
</div>
<span class="text-sm font-medium text-gray-300">Add Photos</span>
<span class="text-xs text-gray-500">Show off your new look</span>
</button>
</section>
<!-- Compliment Chips -->
<section class="mb-10">
<p class="text-xs font-bold uppercase tracking-widest text-gray-500 mb-4 px-1">What stood out?</p>
<div class="flex flex-wrap gap-3">
<button class="px-4 py-2 rounded-full glass-card border-primary/40 bg-primary/10 text-xs font-semibold text-primary">
                    Great Vibe
                </button>
<button class="px-4 py-2 rounded-full glass-card text-xs font-semibold text-gray-300 hover:border-primary/40">
                    Professional
                </button>
<button class="px-4 py-2 rounded-full glass-card text-xs font-semibold text-gray-300 hover:border-primary/40">
                    Clean Space
                </button>
<button class="px-4 py-2 rounded-full glass-card text-xs font-semibold text-gray-300 hover:border-primary/40">
                    Lasting Results
                </button>
<button class="px-4 py-2 rounded-full glass-card text-xs font-semibold text-gray-300 hover:border-primary/40">
                    Punctual
                </button>
</div>
</section>
<!-- Bottom Action -->
<footer class="mt-auto">
<button class="w-full py-4 rounded-xl gradient-submit text-white font-bold text-lg shadow-lg shadow-primary/20 active:scale-[0.97] transition-transform">
                Submit Review
            </button>
<p class="text-center text-[10px] text-gray-600 mt-4 px-6 leading-relaxed">
                By submitting, you agree to Merakí's Review Guidelines and Terms of Service.
            </p>
</footer>
<!-- iOS Home Indicator Placeholder -->
<div class="h-8 w-full"></div>
</main>
</body></html>
