<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#eebd2b", // Champagne Gold
                        "background-light": "#f8f7f6",
                        "background-dark": "#0F0F13", // Deep Warm Black
                        "rose-gold": "#e5b4a2",
                        "rose-white": "#FFF9F6",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-button {
            background: linear-gradient(90deg, #e5b4a2 0%, #eebd2b 100%);
        }
        .ios-shadow {
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-rose-white antialiased min-h-screen">
<!-- iOS Status Bar Simulation -->
<div class="sticky top-0 z-50 bg-background-dark/80 backdrop-blur-md">
<div class="flex justify-between items-center px-6 pt-4 pb-2">
<span class="text-sm font-semibold">9:41</span>
<div class="flex gap-1.5 items-center">
<span class="material-icons-round text-xs">signal_cellular_alt</span>
<span class="material-icons-round text-xs">wifi</span>
<span class="material-icons-round text-xs">battery_full</span>
</div>
</div>
<!-- Header -->
<header class="flex items-center justify-between px-6 py-4">
<button class="w-10 h-10 flex items-center justify-start focus:outline-none">
<span class="material-icons-round text-2xl">arrow_back_ios</span>
</button>
<h1 class="text-lg font-bold">Payment Methods</h1>
<button class="text-primary font-semibold text-sm">Add New</button>
</header>
</div>
<main class="px-6 pb-32">
<!-- Saved Cards Section -->
<section class="mt-6">
<h2 class="text-xs uppercase tracking-widest text-slate-500 font-bold mb-4 ml-1">Your Saved Cards</h2>
<div class="space-y-4">
<!-- Visa Card (Default) -->
<div class="glass rounded-xl p-5 ios-shadow relative overflow-hidden group">
<div class="flex justify-between items-start">
<div class="flex flex-col gap-4">
<div class="w-12 h-8 flex items-center justify-center bg-white/10 rounded-md">
<img alt="Visa" class="w-8" data-alt="Visa logo in blue and yellow" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC8JlZBmiF68PHo1O2Z2b_FvL4EFgco88W7jPewMamButK5wCclTBxE_2SoZqgmPoJ6KFVElJnv2qRccIdRokIT9PBaeyBkaND4BsPgPIRuCu9ght2yPgnYzQ1dpQOMuLgklzyMauvpSqXXYV2Wvh4mpReaUUE-o7N1aIRxxbRWA7HVSkrjat3axH78a2m72HWw35at51EAgiw6e9z10_Qww5mnOczKAXQkDlnip599FrcIy3Ftf_hPjFRLKlMrYhVJQVu_8wt1wEbP"/>
</div>
<div>
<p class="text-xl tracking-widest font-medium">•••• 4242</p>
<p class="text-xs text-slate-400 mt-1 uppercase">Expiry 12/26</p>
</div>
</div>
<div class="flex flex-col items-end gap-3">
<span class="px-3 py-1 bg-rose-gold/20 text-rose-gold text-[10px] font-bold rounded-full uppercase tracking-wider border border-rose-gold/30">Default</span>
<button class="text-slate-500 hover:text-red-400 transition-colors">
<span class="material-icons-round text-xl">delete_outline</span>
</button>
</div>
</div>
</div>
<!-- Mastercard -->
<div class="glass rounded-xl p-5 ios-shadow relative group">
<div class="flex justify-between items-start">
<div class="flex flex-col gap-4">
<div class="w-12 h-8 flex items-center justify-center bg-white/10 rounded-md">
<img alt="Mastercard" class="w-8" data-alt="Mastercard logo in red and orange" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBrH06R_4SbuOnvT8W-KG2GYdgrGpaaCwNSi3xfqtHTnwGbVfo5Lht1q1COT2ffQVI_YOt0Hm8IjneOfX81fCfVG5DiFoAoDo3-tzfqUYbySHBaOYQAX813Dl7lLu-GPvwn8DPnJ1LgiPcoi1J3cjGVoCblgLNnZgbK1g9OB7a1PixGi0xS1DZnyB0e7Ndz6k6rmkkKBjwtvHIgeE0MuSZlq1esq_qnwXpB8wo9ssowGSc7Z4YoSFnxfboUNoxIltz5BtnzPRXRIjcb"/>
</div>
<div>
<p class="text-xl tracking-widest font-medium">•••• 8888</p>
<p class="text-xs text-slate-400 mt-1 uppercase">Expiry 05/25</p>
</div>
</div>
<div class="flex flex-col items-end">
<button class="text-slate-500 hover:text-red-400 transition-colors">
<span class="material-icons-round text-xl">delete_outline</span>
</button>
</div>
</div>
</div>
<!-- Add New Placeholder -->
<button class="w-full border-2 border-dashed border-primary/40 rounded-xl p-8 flex flex-col items-center justify-center gap-2 hover:bg-primary/5 transition-all group">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center group-hover:scale-110 transition-transform">
<span class="material-icons-round text-primary text-2xl">add</span>
</div>
<span class="text-sm font-medium text-primary">Add New Payment Method</span>
</button>
</div>
</section>
<!-- Form Section (Preview) -->
<section class="mt-10">
<h2 class="text-xs uppercase tracking-widest text-slate-500 font-bold mb-6 ml-1">Card Information</h2>
<div class="space-y-6">
<div class="relative">
<label class="absolute -top-2.5 left-4 px-1 bg-background-dark text-[10px] font-bold text-primary uppercase tracking-wider">Card Number</label>
<input class="w-full bg-transparent border border-white/10 rounded-lg px-4 py-4 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-slate-600" placeholder="0000 0000 0000 0000" type="text"/>
<span class="material-icons-round absolute right-4 top-4 text-slate-600">credit_card</span>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="relative">
<label class="absolute -top-2.5 left-4 px-1 bg-background-dark text-[10px] font-bold text-primary uppercase tracking-wider">Expiry Date</label>
<input class="w-full bg-transparent border border-white/10 rounded-lg px-4 py-4 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-slate-600" placeholder="MM/YY" type="text"/>
</div>
<div class="relative">
<label class="absolute -top-2.5 left-4 px-1 bg-background-dark text-[10px] font-bold text-primary uppercase tracking-wider">CVC</label>
<input class="w-full bg-transparent border border-white/10 rounded-lg px-4 py-4 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-slate-600" placeholder="123" type="text"/>
<span class="material-icons-round absolute right-4 top-4 text-slate-600">help_outline</span>
</div>
</div>
</div>
</section>
<!-- Security Badge -->
<div class="mt-10 flex flex-col items-center justify-center gap-2 opacity-60">
<div class="flex items-center gap-1.5">
<span class="material-icons-round text-sm">lock</span>
<span class="text-xs font-semibold uppercase tracking-widest">Secured by Stripe</span>
</div>
<p class="text-[10px] text-center px-8 text-slate-500">Your payment data is encrypted and never stored on our servers.</p>
</div>
</main>
<!-- Footer Action -->
<footer class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-background-dark via-background-dark/95 to-transparent">
<button class="w-full gradient-button text-background-dark font-bold py-4 rounded-xl shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Save Changes</span>
<span class="material-icons-round text-lg">check_circle</span>
</button>
<!-- iOS Home Indicator -->
<div class="w-32 h-1 bg-white/20 rounded-full mx-auto mt-6"></div>
</footer>
</body></html>
