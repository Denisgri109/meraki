<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Booking Success - Merakí</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e8305e",
                        "background-light": "#f8f6f6",
                        "background-dark": "#0F0F13",
                        "rose-white": "#FFF5F7",
                        "champagne-gold": "#F7E7CE",
                    },
                    fontFamily: {
                        "display": ["Noto Serif", "serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-btn {
            background: linear-gradient(135deg, #e8305e 0%, #F7E7CE 100%);
        }
        .rose-gold-text {
            background: linear-gradient(to right, #B76E79, #F7E7CE);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .confetti-overlay {
            background-image: radial-gradient(circle, #F7E7CE 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex items-center justify-center p-4">
<!-- iOS Frame Emulation -->
<div class="relative w-full max-w-[400px] h-[850px] bg-background-dark rounded-[3rem] border-[8px] border-zinc-800 shadow-2xl overflow-hidden flex flex-col">
<!-- Status Bar -->
<div class="flex justify-between items-center px-8 pt-6 pb-2 text-white text-sm">
<span>9:41</span>
<div class="flex items-center gap-1.5">
<span class="material-icons text-[14px]">signal_cellular_alt</span>
<span class="material-icons text-[14px]">wifi</span>
<span class="material-icons text-[14px]">battery_full</span>
</div>
</div>
<!-- Celebratory Header Section -->
<div class="relative flex flex-col items-center pt-10 pb-6 overflow-hidden">
<!-- Animated Gold Elements Placeholder (CSS Pattern) -->
<div class="absolute inset-0 opacity-20 confetti-overlay pointer-events-none"></div>
<!-- Checkmark Frame -->
<div class="relative w-24 h-24 mb-6">
<div class="absolute inset-0 rounded-full border-2 border-primary/40 animate-pulse"></div>
<div class="absolute inset-2 rounded-full border border-champagne-gold/30"></div>
<div class="flex items-center justify-center w-full h-full rounded-full glass">
<span class="material-icons text-5xl rose-gold-text">check_circle</span>
</div>
</div>
<h1 class="text-3xl font-bold text-rose-white tracking-tight mb-2">Booking Confirmed!</h1>
<p class="text-primary font-medium tracking-wide text-sm uppercase">See you soon at Merakí</p>
</div>
<!-- Appointment Card -->
<div class="px-6 flex-grow">
<div class="glass rounded-xl p-6 shadow-xl relative overflow-hidden">
<!-- Subtle Glow -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-primary/10 rounded-full blur-3xl"></div>
<div class="flex flex-col gap-6">
<!-- Service Info -->
<div>
<h2 class="text-xl font-bold text-white mb-1">Volume Lash Extensions</h2>
<div class="flex items-center gap-2 text-zinc-400 text-sm">
<span class="material-icons text-[16px]">calendar_today</span>
<span>Tuesday, March 15 at 2:30 PM</span>
</div>
</div>
<!-- Professional Info -->
<div class="flex items-center gap-4 py-4 border-y border-white/10">
<img alt="Master Isabella Martinez" class="w-14 h-14 rounded-full object-cover border-2 border-champagne-gold/30" data-alt="Professional portrait of a master beauty specialist" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAD3J9xblJOviC5vOx8HPY_PyvudL1SI5aomyI_tYhyMSvFzprwjvsYXQyOwAAz6_ZABYXTAQrme-wFvbbRPHMJozYIO7gBd5tAf_PlCoT7-iagDsxiD8Wir8QsBM3ybv_2gdC4XRGQLxWgZLxxLOvyMXiNSPu9KiuxWCKZkJQPEsIFTRVjnmN3m4GxmBt0Zk2zwkvb1R8QMUOlmpW5RXVaoisQM3VelDQubLADn7kma0eSIvr7jTwdPfPY8vFOO-hi9kDyPuItLcbD"/>
<div class="flex flex-col">
<span class="text-white font-medium">Master Isabella Martinez</span>
<div class="flex items-center gap-1 text-zinc-400 text-xs">
<span class="material-icons text-[14px]">location_on</span>
<span>Merakí Elite Studio • Paris</span>
</div>
</div>
</div>
<!-- Badges -->
<div class="flex flex-wrap gap-3">
<div class="flex items-center gap-2 bg-zinc-800/50 px-3 py-1.5 rounded-full border border-white/5">
<span class="material-icons text-emerald-400 text-[14px]">verified</span>
<span class="text-xs text-zinc-300">€24 deposit secured</span>
</div>
<div class="flex items-center gap-2 bg-primary/20 px-3 py-1.5 rounded-full border border-primary/30">
<span class="material-icons text-primary text-[14px]">stars</span>
<span class="text-xs text-rose-white font-semibold">+50 Loyalty Points</span>
</div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="mt-8 flex flex-col gap-3">
<button class="w-full bg-white text-background-dark font-bold py-4 rounded-lg flex items-center justify-center gap-2 hover:bg-zinc-200 transition-colors">
<span class="material-icons">event</span>
                    Add to Calendar
                </button>
<button class="w-full glass text-white font-medium py-4 rounded-lg flex items-center justify-center gap-2 hover:bg-white/10 transition-colors">
                    View Booking Details
                </button>
</div>
</div>
<!-- Bottom Actions -->
<div class="px-6 pb-12 mt-auto">
<button class="w-full gradient-btn text-background-dark font-bold py-5 rounded-xl shadow-lg shadow-primary/20 hover:opacity-90 transition-opacity">
                Done
            </button>
<!-- Home Indicator -->
<div class="mt-8 w-32 h-1.5 bg-white/20 mx-auto rounded-full"></div>
</div>
</div>
<!-- Decorative Background Glows for the full page -->
<div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/10 rounded-full blur-[120px] -z-10"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-champagne-gold/10 rounded-full blur-[120px] -z-10"></div>
</body></html>
