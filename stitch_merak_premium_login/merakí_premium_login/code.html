<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Merakí Premium Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&amp;family=Playfair+Display:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#d48a82",
            "champagne": "#E6C090",
            "rose-white": "#FFF5F5",
            "background-light": "#f8f6f6",
            "background-dark": "#0F0F13",
            "surface-dark": "#1E1E24",
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"],
            "serif-display": ["Playfair Display", "serif"]
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .glass-input {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(30, 30, 36, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .text-glow {
      text-shadow: 0 0 15px rgba(212, 138, 130, 0.4);
    }
    .gradient-bg {
      background: radial-gradient(circle at top right, #1E1E24, #0F0F13);
    }
    .btn-gradient {
      background: linear-gradient(135deg, #d48a82 0%, #E6C090 100%);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-800 dark:text-rose-white min-h-screen flex items-center justify-center p-4">
<!-- Mobile Container Simulator -->
<div class="relative w-full max-w-[400px] aspect-[9/19.5] bg-background-light dark:bg-background-dark shadow-2xl overflow-hidden rounded-xl border border-white/5 flex flex-col gradient-bg">
<!-- Status Bar (Decorative) -->
<div class="w-full h-12 flex justify-between items-center px-8 pt-4">
<span class="text-xs font-semibold opacity-80">9:41</span>
<div class="flex gap-1.5 items-center">
<span class="material-symbols-outlined text-[14px]">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[14px]">wifi</span>
<span class="material-symbols-outlined text-[14px]">battery_full</span>
</div>
</div>
<!-- Main Content -->
<div class="flex-1 flex flex-col px-8 pt-12">
<!-- Brand Identity -->
<div class="text-center mb-14">
<div class="inline-block relative">
<h1 class="font-serif-display text-5xl tracking-tight text-primary text-glow italic">Merakí</h1>
<div class="absolute -inset-2 bg-primary/10 blur-2xl rounded-full"></div>
</div>
<p class="mt-3 text-[10px] tracking-[0.3em] uppercase text-champagne/70 font-medium">Beauty with Soul</p>
</div>
<!-- Login Form -->
<div class="space-y-5">
<div class="space-y-2">
<label class="text-[11px] uppercase tracking-widest text-white/40 ml-4 font-semibold">Email Address</label>
<div class="relative">
<input class="w-full h-14 rounded-full glass-input px-6 text-sm focus:outline-none focus:ring-1 focus:ring-primary/50 transition-all placeholder:text-white/20" placeholder="name@example.com" type="email"/>
</div>
</div>
<div class="space-y-2">
<label class="text-[11px] uppercase tracking-widest text-white/40 ml-4 font-semibold">Password</label>
<div class="relative">
<input class="w-full h-14 rounded-full glass-input px-6 text-sm focus:outline-none focus:ring-1 focus:ring-primary/50 transition-all placeholder:text-white/20" placeholder="••••••••" type="password"/>
<button class="absolute right-5 top-1/2 -translate-y-1/2 text-white/30 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<div class="text-right">
<a class="text-xs font-medium text-champagne/80 hover:text-champagne transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Primary Action -->
<button class="w-full h-14 rounded-full btn-gradient text-white font-bold text-sm tracking-wide shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform mt-4">
          SIGN IN
        </button>
</div>
<!-- Divider -->
<div class="relative flex items-center py-10">
<div class="flex-grow border-t border-white/5"></div>
<span class="flex-shrink mx-4 text-[10px] text-white/30 uppercase tracking-[0.2em] font-medium">or continue with</span>
<div class="flex-grow border-t border-white/5"></div>
</div>
<!-- Social Logins -->
<div class="flex justify-center gap-6">
<button class="w-16 h-16 rounded-full glass-input flex items-center justify-center group active:scale-95 transition-all">
<img alt="Google" class="w-6 h-6 opacity-70 group-hover:opacity-100 transition-opacity" data-alt="Google colorful logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA4vTglS1IywHDq6FqesT46Plz5S0BvGLKv5xizH3QU8u2VzKG74ze1gpKoBPY317Df6wACpYiwMOV_Vq1OqgrPnDFlDkSUrG4_Tcg01QSCdQ1yofXS0YrI2yfO5JThtAdpK_-PUOflczZUeQVjSdXdK-yoopMnYaiBs-Wj_619jP06YAwT2n2z0uzdAqQUZZUwoRiSfNMWHDqg8CtoQexzgxUcruv-MDmE02e6mZleJ2YJ-iYwaP5TlO8MbFljP2IZoAm_7y0_HIE8"/>
</button>
<button class="w-16 h-16 rounded-full glass-input flex items-center justify-center group active:scale-95 transition-all">
<svg class="w-6 h-6 fill-white/70 group-hover:fill-white transition-colors" viewbox="0 0 384 512">
<path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"></path>
</svg>
</button>
</div>
<!-- Footer -->
<div class="mt-auto pb-10 text-center">
<p class="text-[13px] text-white/40">
          Don't have an account? 
          <a class="text-primary font-bold hover:underline transition-all underline-offset-4 ml-1" href="#">Sign Up</a>
</p>
</div>
</div>
<!-- Screen Bottom Indicator -->
<div class="w-full flex justify-center pb-2">
<div class="w-32 h-1 bg-white/10 rounded-full"></div>
</div>
<!-- Decorative Glow Elements -->
<div class="absolute -top-20 -left-20 w-64 h-64 bg-primary/10 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute -bottom-20 -right-20 w-64 h-64 bg-champagne/5 rounded-full blur-[100px] pointer-events-none"></div>
</div>
</body></html>
