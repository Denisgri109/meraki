appId: ${APP_ID}
---
# Tier 3 — Flow 5: Owner QR pay code lifecycle.
# Requires: OWNER_EMAIL / OWNER_PASSWORD seeded owner account.
- launchApp
- inputText:
    text: "${OWNER_EMAIL}"
    id: "login-email"
- inputText:
    text: "${OWNER_PASSWORD}"
    id: "login-password"
- tapOn: "Login"
- tapOn: "Menu"
- tapOn: "QR Payments"
- # Owner CRUD: add a payload-based code
- tapOn:
    id: "qr-pay-add"
- inputText:
    id: "qr-pay-provider-name"
    text: "Revolut E2E"
- inputText:
    id: "qr-pay-payload"
    text: "revolut://pay?test=1"
- tapOn:
    id: "qr-pay-save"
- assertVisible: "Revolut E2E"
- # Deactivate it so instructors stop seeing it
- tapOn:
    id: "qr-pay-toggle-active"
- # Cleanup: delete the code to keep the flow idempotent
- tapOn:
    id: "qr-pay-delete"
- tapOn: "Confirm"
