appId: ${APP_ID}
---
# Tier 3 — Flow 2: Pilates waiver gate.
# A pilates booking by a user with NO signed waiver must be intercepted.
- runFlow: 01-login-client.yaml
- tapOn: "Book"
- tapOn:
    id: "service-pilates-reformer"
- tapOn:
    id: "timeslot-first-available"
- tapOn: "Continue"
# Waiver sheet must open BEFORE the confirm step
- assertVisible: "Pilates Waiver" # PilatesWaiverSheet title copy
- assertVisible: "Emergency Contact"
- # Sign + submit
- inputText:
    id: "waiver-emergency-name"
    text: "Jane Doe"
- inputText:
    id: "waiver-emergency-phone"
    text: "+353871234567"
- tapOn:
    id: "waiver-agree-terms"
- tapOn:
    id: "waiver-agree-liability"
- tapOn:
    id: "waiver-submit"
- # Gate passed — booking confirm screen now reachable
- assertVisible:
    id: "booking-confirm-screen"
